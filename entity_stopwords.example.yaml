# Stopword list for proper-noun detection (clustering.entity_weight > 0).
#
# Individual capitalized words that should NOT count as a proper noun:
# generic news nouns that are capitalized in German even without
# proper-noun status ("Regierung", "Krieg", "Bericht").
# Multi-word phrases and acronyms (party/org acronyms, full personal names) are always
# detected as proper nouns and are not affected by this list.
#
# Freely extendable/shortenable - no code change needed.

